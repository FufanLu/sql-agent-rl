# SFT -> RL: multi-turn GRPO starting from the SFT model that learned to call
# the tool (models/qwen3b_verl_sft_toolinit: SFT 11325610 on top of the
# tool-call embedding fix, docs/failures.md #29). Compared against qwen3b_mt
# (RL from the instruct model), so everything else is the same: 342 questions,
# 128 per step x 5 samples, 60 steps (30 epochs), lr 1e-6, no KL.
# One difference: this run has flash-attn, so it uses padding removal and
# token-count batching instead of qwen3b_mt's sdpa settings (_sdpa.yaml);
# that changes speed and memory, not the objective.
#   cluster/submit_grpo.sh qwen3b_sft_mt qwen3b_verl_sft_toolinit 2
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - base
  - _self_

trainer:
  experiment_name: qwen3b_sft_mt
  total_epochs: 30  # 342 / 128 = 2 full steps per epoch x 30 = 60 steps, as qwen3b_mt
