# Main run: Qwen2.5-Coder-3B-Instruct, multi-turn GRPO from the instruct model.
#   cluster/submit_grpo.sh qwen3b_mt Qwen2.5-Coder-3B-Instruct 4
hydra:
  searchpath:
    - pkg://verl.trainer.config

defaults:
  - base
  - _sdpa      # until the flash-attn wheel is in the env (docs/failures.md #1)
  - _self_

trainer:
  experiment_name: qwen3b_mt
  total_epochs: 30  # 342 questions / 128 per step = 2 full steps per epoch (verl drops the remainder) x 30 = 60 steps
