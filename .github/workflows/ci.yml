name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      # verl's config files, for tests/test_hydra_compose.py (no torch/ray)
      - run: uv pip install --python .venv/bin/python --no-deps verl==0.9.1 && uv pip install --python .venv/bin/python hydra-core "antlr4-python3-runtime==4.9.3"
      - run: make check
